<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPCM 2026 Flyer Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fb; --card:#ffffff; --ink:#12123a; --muted:#585a7e; --line:#d6d8ee;
  --accent:#2a1fa8; --accent-ink:#ffffff; --warm:#ff9a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1024; --card:#191a38; --ink:#eceeff; --muted:#a3a6cf; --line:#2e3060;
    --accent:#ff9a1f; --accent-ink:#1a1030;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1024; --card:#191a38; --ink:#eceeff; --muted:#a3a6cf; --line:#2e3060;
  --accent:#ff9a1f; --accent-ink:#1a1030;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Poppins,"Segoe UI",system-ui,sans-serif; font-weight:500; line-height:1.5;
}
.wrap{max-width:1040px; margin:0 auto; padding:28px 20px 48px}
h1{font-weight:800; font-size:clamp(28px,5vw,44px); line-height:1.1; margin:0 0 10px; letter-spacing:-0.01em}
.lede{margin:0 0 28px; color:var(--muted); max-width:46ch}
.grid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,0.9fr); gap:32px; align-items:start}
.stage{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px}
canvas{display:block; width:100%; height:auto; aspect-ratio:1/1; border-radius:10px; cursor:pointer}
canvas.has-photo{cursor:grab; touch-action:none}
canvas.has-photo:active{cursor:grabbing}
.panel{display:flex; flex-direction:column; gap:22px}
.step{display:flex; flex-direction:column; gap:8px}
.step > label, .step > .lbl{font-weight:600; font-size:15px}
.hint{margin:0; font-size:13px; color:var(--muted)}
input[type=text]{
  font:inherit; font-weight:600; font-size:17px; color:var(--ink); background:var(--card);
  border:2px solid var(--line); border-radius:12px; padding:13px 14px; width:100%;
}
input[type=text]::placeholder{color:var(--muted); font-weight:500}
button{
  font:inherit; font-weight:600; font-size:16px; border-radius:12px; padding:14px 18px;
  cursor:pointer; border:2px solid var(--accent); transition:background .15s, opacity .15s;
}
.btn-line{background:transparent; color:var(--accent)}
.btn-line:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn-main{background:var(--accent); color:var(--accent-ink)}
.btn-main:disabled{opacity:.4; cursor:not-allowed}
:focus-visible{outline:3px solid var(--warm); outline-offset:2px}
input[type=range]{width:100%; accent-color:var(--accent)}
#zoomRow{display:none}
#zoomRow.on{display:flex; flex-direction:column; gap:6px}
#status{min-height:1.5em; margin:0; font-size:14px; color:var(--muted)}
#result{margin-top:8px}
#result img{width:100%; height:auto; border-radius:12px; border:1px solid var(--line)}
.foot{margin-top:36px; font-size:13px; color:var(--muted)}
@media (max-width:820px){
  .grid{grid-template-columns:1fr; gap:22px}
}
@media (prefers-reduced-motion:reduce){ button{transition:none} }
</style>
</head>
<body>
<main class="wrap">
  <h1>Make your KPCM 2026 flyer</h1>
  <p class="lede">Add your photo and your name. We’ll place them on the official flyer, ready to share.</p>

  <div class="grid">
    <div class="stage">
      <canvas id="cv" width="1280" height="1280" aria-label="Flyer preview"></canvas>
    </div>

    <div class="panel">
      <div class="step">
        <span class="lbl">1. Your photo</span>
        <button type="button" class="btn-line" id="pick">Choose photo</button>
        <input type="file" id="file" accept="image/*" hidden>
        <p class="hint">Your photo stays on your device. It is never uploaded.</p>
        <div id="zoomRow">
          <label for="zoom" class="hint">Drag the photo on the flyer to reposition it. Use the slider to zoom.</label>
          <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
        </div>
      </div>

      <div class="step">
        <label for="nm">2. Your name</label>
        <input type="text" id="nm" maxlength="30" placeholder="e.g. Favourite" autocomplete="given-name">
      </div>

      <div class="step">
        <span class="lbl">3. Get your flyer</span>
        <button type="button" class="btn-main" id="dl" disabled>Download flyer</button>
        <p id="status" role="status" aria-live="polite">Loading flyer…</p>
        <div id="result" hidden><img id="resImg" alt="Your finished flyer"></div>
      </div>
    </div>
  </div>

  <p class="foot">Kingdom Power Camp Meeting ’26 · Kingdom Builders Lovelife Church Inc.</p>
</main>

<script>
const TPL="template.jpg", MASK="mask.png";
const S=1280, CX=928.5, CY=481, R=236, NAME_X=931, NAME_Y=784, NAME_W=500;
const FONT='Poppins,"Montserrat","Arial Black",sans-serif';
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const off=document.createElement("canvas"); off.width=off.height=S;
const octx=off.getContext("2d");
const $=id=>document.getElementById(id);
let tpl=null, mask=null, photo=null, zoom=1, ox=0, oy=0, name="";

function load(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function setStatus(t){$("status").textContent=t;}

function dims(){
  const s=Math.max(2*R/photo.width,2*R/photo.height)*zoom;
  return {w:photo.width*s,h:photo.height*s};
}
function clampOffsets(){
  if(!photo)return;
  const d=dims(), mx=Math.max(0,(d.w-2*R)/2), my=Math.max(0,(d.h-2*R)/2);
  ox=Math.min(mx,Math.max(-mx,ox)); oy=Math.min(my,Math.max(-my,oy));
}

function draw(exp){
  if(!tpl||!mask)return;
  ctx.clearRect(0,0,S,S);
  ctx.drawImage(tpl,0,0,S,S);
  if(photo){
    const d=dims();
    octx.globalCompositeOperation="source-over";
    octx.clearRect(0,0,S,S);
    octx.drawImage(photo,CX+ox-d.w/2,CY+oy-d.h/2,d.w,d.h);
    octx.globalCompositeOperation="destination-in";
    octx.drawImage(mask,0,0,S,S);
    ctx.drawImage(off,0,0);
  }else if(!exp){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#9a9cc0";
    ctx.font='500 90px '+FONT; ctx.fillText("+",CX,CY-34);
    ctx.font='600 30px '+FONT; ctx.fillText("Tap to add your photo",CX,CY+40);
  }
  const t=name.trim();
  ctx.textAlign="center"; ctx.textBaseline="middle";
  if(!t){
    if(!exp){ctx.fillStyle="#b4b6d2"; ctx.font='800 58px '+FONT; ctx.fillText("Your name",NAME_X,NAME_Y);}
    return;
  }
  let size=66;
  do{ctx.font='800 '+size+'px '+FONT; size-=2;}while(ctx.measureText(t).width>NAME_W&&size>24);
  ctx.fillStyle="#12123a"; ctx.fillText(t,NAME_X,NAME_Y);
}

function refresh(){
  const ready=!!photo&&name.trim().length>0;
  $("dl").disabled=!ready;
  if(!tpl)return;
  if(!photo&&!name.trim()) setStatus("Add your photo and name to get started.");
  else if(!photo) setStatus("Now add your photo.");
  else if(!name.trim()) setStatus("Now type your name.");
  else setStatus("Looks good? Download your flyer.");
  cv.classList.toggle("has-photo",!!photo);
  draw();
}

$("pick").addEventListener("click",()=>$("file").click());
let moved=false;
cv.addEventListener("click",()=>{ if(!photo&&!moved) $("file").click(); });

$("file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    photo=img; zoom=1; ox=0; oy=0; $("zoom").value=1;
    $("zoomRow").classList.add("on"); $("pick").textContent="Change photo";
    refresh();
  };
  img.onerror=()=>setStatus("That file could not be read. Please choose a JPG or PNG photo.");
  img.src=url;
});
$("nm").addEventListener("input",e=>{name=e.target.value; refresh();});
$("zoom").addEventListener("input",e=>{zoom=+e.target.value; clampOffsets(); draw();});

let drag=null;
cv.addEventListener("pointerdown",e=>{
  if(!photo)return;
  drag={x:e.clientX,y:e.clientY,ox,oy}; moved=false; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",e=>{
  if(!drag)return;
  const k=S/cv.getBoundingClientRect().width;
  ox=drag.ox+(e.clientX-drag.x)*k; oy=drag.oy+(e.clientY-drag.y)*k;
  moved=true; clampOffsets(); draw();
});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{drag=null;}));

$("dl").addEventListener("click",async()=>{
  draw(true);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  draw();
  const clean=name.trim().replace(/[^\p{L}\p{N}\- ]+/gu,"").replace(/\s+/g,"-")||"flyer";
  const fname="KPCM-2026-"+clean+".png";
  let dl=null;
  try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){dl=null;}
  if(dl){
    try{await dl.save({filename:fname,data:blob}); setStatus("Flyer saved. Share it with your friends!"); return;}
    catch(err){ if(err&&err.code==="declined"){setStatus("Download cancelled.");return;} }
  }
  const url=URL.createObjectURL(blob);
  $("resImg").src=url; $("result").hidden=false;
  const a=document.createElement("a"); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setStatus("If the download did not start, press and hold the flyer below, then choose Save image.");
});

Promise.all([load(TPL),load(MASK)]).then(([t,m])=>{
  tpl=t; mask=m; refresh();
  if(document.fonts&&document.fonts.load){
    document.fonts.load("800 64px Poppins").then(()=>draw()).catch(()=>{});
    document.fonts.load("600 30px Poppins").then(()=>draw()).catch(()=>{});
  }
}).catch(()=>setStatus("The flyer template could not be loaded. Please refresh the page."));
</script>
</body>
</html>
